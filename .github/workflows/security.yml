name: ResponseOne Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  # ==========================================================
  # Semgrep - SAST
  # ==========================================================

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/python \
            --json \
            --output=semgrep.json \
            .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep.json


  # ==========================================================
  # Trivy - Dependency / Filesystem Scan
  # ==========================================================

  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json


  # ==========================================================
  # Gitleaks - Secrets Detection
  # ==========================================================

  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # OWASP ZAP - DAST
  # ==========================================================

  zap:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          pip install -r requirements.txt

      - name: Start ResponseOne application
        run: |
          python app/main.py > app.log 2>&1 &
          sleep 5

      - name: Check application health
        run: |
          curl --fail http://127.0.0.1:5000/health

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:5000"
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md


  # ==========================================================
  # ResponseOne - Semgrep Ingestion
  # ==========================================================

  ingest-semgrep:
    name: Ingest Semgrep Findings
    runs-on: ubuntu-latest

    needs: semgrep

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-json
          path: reports

      # ------------------------------------------------------
      # Test that GitHub Actions received the secrets.
      # The actual secret values are NEVER printed.
      # ------------------------------------------------------

      - name: Check ResponseOne secrets
        env:
          RESPONSEONE_API_URL: ${{ secrets.RESPONSEONE_API_URL }}
          RESPONSEONE_INGEST_TOKEN: ${{ secrets.RESPONSEONE_INGEST_TOKEN }}
        run: |
          if [ -z "$RESPONSEONE_API_URL" ]; then
            echo "ERROR: RESPONSEONE_API_URL is empty"
            exit 1
          fi

          if [ -z "$RESPONSEONE_INGEST_TOKEN" ]; then
            echo "ERROR: RESPONSEONE_INGEST_TOKEN is empty"
            exit 1
          fi

          echo "SUCCESS: Both ResponseOne secrets are available"

      # ------------------------------------------------------
      # Send Semgrep findings to ResponseOne
      # ------------------------------------------------------

      - name: Send Semgrep findings to ResponseOne
        env:
          RESPONSEONE_API_URL: ${{ secrets.RESPONSEONE_API_URL }}
          RESPONSEONE_INGEST_TOKEN: ${{ secrets.RESPONSEONE_INGEST_TOKEN }}
        run: |
          python scripts/ingest_semgrep.py reports/semgrep.json
